name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - sdk
          - metadata
      version:
        description: 'Version (e.g. 0.1.0, 1.0.0-beta.1)'
        required: true
        type: string
      tag:
        description: 'npm dist-tag'
        required: true
        type: choice
        options:
          - latest
          - beta
          - next
      dry-run:
        description: 'Dry run (build and pack without publishing)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dependencies
        run: bunx turbo build --filter=@userplane/${{ inputs.package }}...

      - name: Build metadata
        if: inputs.package == 'sdk'
        run: |
          cd packages/metadata
          bun run build:npm

      - name: Build package
        run: |
          cd packages/${{ inputs.package }}
          bun run build:npm

      - name: Set version
        run: |
          cd packages/${{ inputs.package }}
          npm pkg set version=${{ inputs.version }}

      - name: Pack (dry run)
        if: inputs.dry-run
        run: |
          cd packages/${{ inputs.package }}
          npm pack --dry-run 2>&1
          echo ""
          echo "--- Packed tarball contents ---"
          npm pack
          tar tzf userplane-${{ inputs.package }}-${{ inputs.version }}.tgz
          echo ""
          echo "--- package.json in tarball ---"
          tar xzf userplane-${{ inputs.package }}-${{ inputs.version }}.tgz package/package.json -O

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: |
          cd packages/${{ inputs.package }}
          npm publish --access public --tag ${{ inputs.tag }} --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Git tag
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "@userplane/${{ inputs.package }}@${{ inputs.version }}"
          git push origin "@userplane/${{ inputs.package }}@${{ inputs.version }}"
