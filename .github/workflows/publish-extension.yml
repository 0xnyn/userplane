name: Publish Extension to Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (build and authenticate without uploading)'
        required: false
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dependencies
        run: bunx turbo build --filter=@userplane/extension^...

      - name: Build and zip extension
        run: cd apps/extension && bun run zip

      - name: Get extension version
        id: version
        run: echo "version=$(node -p "require('./apps/extension/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Submit to Chrome Web Store (dry run)
        if: inputs.dry-run
        run: |
          cd apps/extension
          bun run submit \
            --chrome-zip .output/userplaneextension-${{ steps.version.outputs.version }}-chrome.zip \
            --dry-run
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Submit to Chrome Web Store
        if: ${{ !inputs.dry-run }}
        run: |
          cd apps/extension
          bun run submit \
            --chrome-zip .output/userplaneextension-${{ steps.version.outputs.version }}-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Git tag
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "extension@${{ steps.version.outputs.version }}"
          git push origin "extension@${{ steps.version.outputs.version }}"
